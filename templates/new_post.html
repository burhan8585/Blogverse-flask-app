<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post</title>
    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet"
    >
    <style>
      body {
        background-color: #f8f9fa;
      }
      .navbar {
        background-color: #0d6efd;
      }
      .navbar-brand {
        color: white !important;
        font-weight: 600;
      }
      .form-container {
        max-width: 600px;
        margin: 3rem auto;
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }
      label {
        font-weight: 500;
        margin-bottom: 0.3rem;
      }
      textarea {
        resize: vertical;
      }
      footer {
        text-align: center;
        padding: 1rem;
        background-color: #0d6efd;
        color: white;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/">My Flask Blog</a>
        <a href="/" class="btn btn-light ms-auto">Back to Home</a>
      </div>
    </nav>

    <!-- Form Section -->
    <div class="form-container">
      <h2 class="text-center mb-4 text-secondary">Create a New Post</h2>

      <form action="/new" method="POST">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input 
            type="text" 
            class="form-control" 
            id="title" 
            name="title" 
            placeholder="Enter post title" 
            required
          >
        </div>

        <div class="mb-3">
          <label for="content" class="form-label">Content</label>
          <textarea 
            class="form-control" 
            id="content" 
            name="content" 
            rows="6" 
            placeholder="Write your blog content here..." 
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Publish Post</button>
      </form>
    </div>

    <footer>
      <p>&copy; 2025 My Flask Blog | Built with ❤️ using Flask & Bootstrap</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
